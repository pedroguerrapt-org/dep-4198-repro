name: T-11991 Vite Plus benchmark
on:
  push:
    branches: [benchmark/t11991-viteplus]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tunnckoCoreHQ/monarch
          ref: 1ff804b6d2cd562b02466a7bcb97bc0b0c7685ac
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Start setup timer
        run: date +%s%N > "$RUNNER_TEMP/vp-start"
      - name: Setup Vite Plus
        id: vp
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: lts
      - name: Record result
        env:
          CACHE_HIT: ${{ steps.vp.outputs.cache-hit }}
          VP_VERSION: ${{ steps.vp.outputs.version }}
          SAMPLE: ${{ matrix.sample }}
        run: |
          python3 - <<'PYRESULT'
          import json,os,time
          start=int(open(os.environ['RUNNER_TEMP']+'/vp-start').read())
          print('BENCHMARK_RESULT='+json.dumps({'elapsed_seconds':round((time.time_ns()-start)/1e9,3),'cache_hit':os.environ['CACHE_HIT'],'vp_version':os.environ['VP_VERSION'],'sample':os.environ['SAMPLE']}))
          PYRESULT
          node --version
          vp --version
